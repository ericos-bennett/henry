[project]
name = "career-scraper"
version = "0.1.0"
description = "Scrapes career pages on a schedule and extracts job listings into structured JSON."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "croniter>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
career-scraper = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
