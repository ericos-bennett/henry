settings:
  llm:
    provider: gemini
    model: gemini-3.7-flash
    api_key_env: LLM_API_KEY
  playwright:
    headless: true
    timeout_ms: 30000
  storage:
    root: data/
  logging:
    level: info

sites:
  - id: voltus
    name: Voltus
    url: https://www.voltus.co/jobs
    frequency: "0 */6 * * *"
    wait_selector: 'a[href*="jobs.lever.co"]'
